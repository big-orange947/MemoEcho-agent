server:
  port: 8092

spring:
  application:
    name: schedule-service
  datasource:
    # 本地原生 MySQL 默认监听 3306；使用 Docker 映射时可通过 SCHEDULE_DB_URL 改成 3307。
    url: ${SCHEDULE_DB_URL:jdbc:mysql://127.0.0.1:3306/memo_echo_schedule?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SCHEDULE_DB_USERNAME:root}
    # 密码不写入仓库，启动前必须通过环境变量提供。
    password: ${SCHEDULE_DB_PASSWORD}
    driver-class-name: ${SCHEDULE_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${SCHEDULE_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${SCHEDULE_DB_MIN_IDLE:1}
      connection-timeout: ${SCHEDULE_DB_CONNECTION_TIMEOUT_MS:5000}
  sql:
    init:
      # 生产环境的结构变更统一交给 Flyway，避免两套初始化机制重复执行。
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

schedule:
  cleanup:
    # 每分钟清理一次逾期日程；列表查询前仍会立即清理，避免等待定时任务。
    fixed-delay-ms: 60000
