server:
  port: 8094

spring:
  application:
    name: task-service
  datasource:
    url: ${TASK_DB_URL:jdbc:mysql://127.0.0.1:3306/memo_echo_task?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${TASK_DB_USERNAME:root}
    password: ${TASK_DB_PASSWORD}
    driver-class-name: ${TASK_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${TASK_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${TASK_DB_MIN_IDLE:1}
      connection-timeout: ${TASK_DB_CONNECTION_TIMEOUT_MS:5000}
  sql:
    init:
      # 生产环境的结构变更统一交给 Flyway，避免两套初始化机制重复执行。
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
