# Memo Echo - Neo4j（Graphiti 时间感知记忆图谱）
# 启动:  docker compose -f scripts/docker-compose.neo4j.yml up -d
# 停止:  docker compose -f scripts/docker-compose.neo4j.yml down
# 查看:  docker compose -f scripts/docker-compose.neo4j.yml logs -f neo4j
# 清空数据卷（重新开始）: docker compose -f scripts/docker-compose.neo4j.yml down -v
# 浏览器管理台: http://localhost:7474  (用户名 neo4j，密码见 NEO4J_PASSWORD 环境变量，默认 memoecho2026)
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: memo-echo-neo4j
    ports:
      - "7474:7474"   # HTTP 管理台
      - "7687:7687"   # Bolt 驱动端口
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-memoecho2026}
      # 官方镜像通过 NEO4J_PLUGINS 自动下载安装 APOC 插件
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
