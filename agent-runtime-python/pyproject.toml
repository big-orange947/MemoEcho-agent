[project]
name = "memo-echo-agent-runtime"
version = "0.1.0"
description = "Python agent runtime for Memo Echo Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "fastembed>=0.8.0,<0.9.0",
  "httpx>=0.28.0",
  "langgraph>=0.2.50,<2.0.0",
  "pypdf>=5.7.0",
  "protobuf>=4.25.8,<6.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "langchain-core>=0.3,<0.4",
  "langchain-openai>=0.2,<0.3",
  "langgraph-checkpoint-sqlite>=3.0.3",
  "aiosqlite>=0.20.0",
  "graphiti-core>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
